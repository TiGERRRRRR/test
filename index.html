<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1218">
<meta name="description" content="Classic Snake and Stackfall falling-blocks — playable offline, installable on phone or desktop.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<title>Pocket Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0f1218;
    --panel: #181d26;
    --panel-2: #222a36;
    --line: #2c3544;
    --text: #e8edf4;
    --muted: #8a97a8;
    --snake: #7bd389;
    --blocks: #5aa9ff;
    --accent: var(--snake);
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    max-width: 560px; margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    gap: 12px;
  }

  /* ---------- Menu ---------- */
  #menu { justify-content: center; overflow-y: auto; }
  .brand { text-align: center; margin-bottom: 8px; }
  .brand h1 { margin: 0; font-size: clamp(28px, 8vw, 40px); letter-spacing: .02em; }
  .brand p { margin: 4px 0 0; color: var(--muted); }
  .cards { display: grid; gap: 12px; }
  .game-card {
    display: flex; align-items: center; gap: 16px;
    padding: 16px; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    transition: transform .12s, border-color .12s;
  }
  .game-card:hover, .game-card:focus-visible { border-color: var(--c); outline: none; }
  .game-card:active { transform: scale(.98); }
  .game-card svg { flex: none; width: 64px; height: 64px; border-radius: 12px; }
  .game-card h2 { margin: 0; font-size: 20px; }
  .game-card p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .game-card .best { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); }
  .game-card .best b { display: block; font-size: 20px; color: var(--c); font-variant-numeric: tabular-nums; }
  .menu-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .chip {
    padding: 8px 14px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); font-size: 14px;
  }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 0; }

  /* ---------- Game ---------- */
  .bar { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    flex: none; width: 42px; height: 42px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 18px;
  }
  .hud { flex: 1; display: flex; justify-content: space-around; gap: 4px; min-width: 0; }
  .stat { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
  #next { display: block; margin-top: 2px; }

  #stage {
    position: relative; flex: 1; min-height: 0;
    display: grid; place-items: center;
    touch-action: none;
  }
  #board { display: block; border-radius: 8px; box-shadow: 0 0 0 2px var(--line), 0 10px 30px rgba(0,0,0,.45); }

  #overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(10, 12, 16, .55);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    border-radius: 8px;
  }
  #overlay .card {
    width: min(320px, 90%);
    padding: 20px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #overlay h2 { margin: 0 0 6px; font-size: 24px; }
  #overlay p { margin: 0 0 16px; color: var(--muted); white-space: pre-line; }
  .btn {
    display: block; width: 100%; padding: 12px; margin-top: 8px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2);
    font-weight: 600;
  }
  .btn.primary { background: var(--accent); border-color: transparent; color: #0b0e14; }

  /* ---------- Touch controls ---------- */
  .pad { display: grid; gap: 10px; touch-action: none; }
  .pad button {
    border-radius: 16px; border: 1px solid var(--line);
    background: var(--panel); font-size: 22px;
    min-height: 58px;
    display: grid; place-items: center;
  }
  .pad button.down, .pad button:active { background: var(--panel-2); border-color: var(--accent); }
  .dpad {
    grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(2, 58px);
    justify-content: center;
    grid-template-areas: ". up ." "left down right";
  }
  .dpad [data-action=up] { grid-area: up; }
  .dpad [data-action=left] { grid-area: left; }
  .dpad [data-action=down] { grid-area: down; }
  .dpad [data-action=right] { grid-area: right; }
  .blockpad { grid-template-columns: repeat(5, 1fr); }
  .keys { text-align: center; color: var(--muted); font-size: 13px; }
  kbd {
    font: 12px ui-monospace, monospace; padding: 1px 6px;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--panel);
  }
  /* Mouse + keyboard devices: hide touch pads, show key hints */
  @media (hover: hover) and (pointer: fine) {
    .pad { display: none; }
  }
  @media not ((hover: hover) and (pointer: fine)) {
    .keys { display: none; }
  }
  @media (max-height: 600px) {
    .pad button { min-height: 46px; }
    .dpad { grid-template-rows: repeat(2, 46px); }
  }
</style>
</head>
<body>

<!-- ================= MENU ================= -->
<section id="menu" class="screen">
  <div class="brand">
    <h1>Pocket Arcade</h1>
    <p>Two classics, one pocket. Works offline.</p>
  </div>
  <div class="cards">
    <button class="game-card" data-game="snake" style="--c: var(--snake)">
      <svg viewBox="0 0 8 8" aria-hidden="true">
        <rect width="8" height="8" fill="#c4d39a"/>
        <g fill="#2f3a1f">
          <rect x="1" y="5" width="4" height="1"/><rect x="4" y="2" width="1" height="4"/>
          <rect x="4" y="2" width="2" height="1"/><rect x="6.25" y="4.25" width=".5" height=".5" transform="rotate(45 6.5 4.5)"/>
        </g>
      </svg>
      <div><h2>Snake</h2><p>The classic phone game</p></div>
      <div class="best">Best<b id="best-snake">0</b></div>
    </button>
    <button class="game-card" data-game="blocks" style="--c: var(--blocks)">
      <svg viewBox="0 0 8 8" aria-hidden="true">
        <rect width="8" height="8" fill="#0b0e14"/>
        <rect x="1" y="1" width="3" height="1" fill="#a855f7"/><rect x="2" y="2" width="1" height="1" fill="#a855f7"/>
        <rect x="1" y="5" width="2" height="2" fill="#facc15"/><rect x="3" y="6" width="4" height="1" fill="#22d3ee"/>
        <rect x="5" y="4" width="1" height="2" fill="#f97316"/><rect x="6" y="5" width="1" height="1" fill="#f97316"/>
      </svg>
      <div><h2>Stackfall</h2><p>Falling blocks: clear the lines</p></div>
      <div class="best">Best<b id="best-blocks">0</b></div>
    </button>
  </div>
  <div class="menu-foot">
    <button class="chip" id="btn-sound">🔊 Sound on</button>
    <button class="chip" id="btn-install" hidden>⬇ Install app</button>
  </div>
  <p class="hint" id="ios-hint" hidden>To install: tap Share, then “Add to Home Screen”.</p>
</section>

<!-- ================= GAME ================= -->
<section id="game" class="screen" hidden>
  <header class="bar">
    <button class="icon-btn" id="btn-back" aria-label="Back to menu">‹</button>
    <div class="hud">
      <div class="stat"><span>Score</span><b id="hud-score">0</b></div>
      <div class="stat"><span>Best</span><b id="hud-best">0</b></div>
      <div class="stat"><span>Level</span><b id="hud-level">1</b></div>
      <div class="stat" id="hud-next"><span>Next</span><canvas id="next"></canvas></div>
    </div>
    <button class="icon-btn" id="btn-pause" aria-label="Pause">❚❚</button>
  </header>

  <div id="stage">
    <canvas id="board"></canvas>
    <div id="overlay">
      <div class="card">
        <h2 id="ov-title"></h2>
        <p id="ov-text"></p>
        <button class="btn primary" id="ov-primary"></button>
        <button class="btn" id="ov-menu">Menu</button>
      </div>
    </div>
  </div>

  <div class="pad dpad" id="pad-snake">
    <button data-action="up" aria-label="Up">▲</button>
    <button data-action="left" aria-label="Left">◀</button>
    <button data-action="down" aria-label="Down">▼</button>
    <button data-action="right" aria-label="Right">▶</button>
  </div>
  <div class="pad blockpad" id="pad-blocks">
    <button data-action="left" aria-label="Move left">◀</button>
    <button data-action="down" aria-label="Soft drop">▼</button>
    <button data-action="right" aria-label="Move right">▶</button>
    <button data-action="rotate" aria-label="Rotate">⟳</button>
    <button data-action="drop" aria-label="Hard drop">⤓</button>
  </div>
  <p class="keys" id="keys-snake"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> move · <kbd>P</kbd> pause</p>
  <p class="keys" id="keys-blocks"><kbd>←</kbd><kbd>→</kbd> move · <kbd>↑</kbd>/<kbd>X</kbd> rotate · <kbd>↓</kbd> soft drop · <kbd>Space</kbd> hard drop · <kbd>P</kbd> pause</p>
</section>

<script>
'use strict';

/* ================= Utilities ================= */
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const rand = (n) => Math.floor(Math.random() * n);
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

const Sound = {
  on: store.get('sound', true),
  ctx: null,
  beep(freq = 440, dur = 0.06, type = 'square', vol = 0.04) {
    if (!this.on) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.ctx.destination);
      o.start(t); o.stop(t + dur);
    } catch {}
  },
  seq(notes, step = 0.08) { notes.forEach((f, i) => setTimeout(() => this.beep(f, step, 'square'), i * step * 1000)); },
};

/* Canvas that draws in grid-cell units, crisp on HiDPI screens. */
function fitCanvas(canvas, cols, rows, cellPx) {
  const dpr = window.devicePixelRatio || 1;
  const w = cols * cellPx, h = rows * cellPx;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(cellPx * dpr, 0, 0, cellPx * dpr, 0, 0);
  return ctx;
}

/* ================= SNAKE ================= */
const LCD = { bg: '#c4d39a', dot: '#b3c38a', ink: '#2f3a1f' };

const SnakeGame = {
  id: 'snake', title: 'Snake', cols: 20, rows: 20, accent: '--snake',
  help: 'Eat to grow. Don’t hit the walls or your own tail.\nEvery 5th bite a bonus bug appears — catch it fast!',

  reset() {
    const y = this.rows >> 1;
    this.body = [{ x: 6, y }, { x: 5, y }, { x: 4, y }];
    this.dir = { x: 1, y: 0 };
    this.queue = [];
    this.eaten = 0; this.score = 0; this.acc = 0;
    this.food = null; this.bonus = null; this.dead = false;
    this.food = this.freeCell();
  },
  get level() { return Math.min(10, 1 + Math.floor(this.eaten / 5)); },
  get interval() { return 150 - (this.level - 1) * 10; },   // 150ms → 60ms
  summary() { return `Length ${this.body.length}`; },

  freeCell() {
    const taken = new Set(this.body.map((p) => p.y * this.cols + p.x));
    if (this.food) taken.add(this.food.y * this.cols + this.food.x);
    if (this.bonus) taken.add(this.bonus.y * this.cols + this.bonus.x);
    const free = [];
    for (let i = 0; i < this.cols * this.rows; i++) if (!taken.has(i)) free.push(i);
    if (!free.length) return null;
    const i = free[rand(free.length)];
    return { x: i % this.cols, y: Math.floor(i / this.cols) };
  },

  press(a) {
    const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[a];
    if (!d) return;
    const last = this.queue[this.queue.length - 1] || this.dir;
    if ((last.x === -d[0] && last.y === -d[1]) || (last.x === d[0] && last.y === d[1])) return;
    if (this.queue.length < 3) this.queue.push({ x: d[0], y: d[1] });
  },
  release() {},
  gesture(g) { this.press(g); },
  swipeLive: true,

  update(dt) {
    this.acc += dt;
    while (!this.dead && this.acc >= this.interval) {
      this.acc -= this.interval;
      this.step();
    }
  },

  step() {
    if (this.queue.length) this.dir = this.queue.shift();
    const head = this.body[0];
    const nx = head.x + this.dir.x, ny = head.y + this.dir.y;
    const eatsFood = this.food && nx === this.food.x && ny === this.food.y;
    const eatsBonus = this.bonus && nx === this.bonus.x && ny === this.bonus.y;
    // The tail moves out of the way this tick unless we're growing.
    const solid = eatsFood ? this.body : this.body.slice(0, -1);
    if (nx < 0 || ny < 0 || nx >= this.cols || ny >= this.rows || solid.some((p) => p.x === nx && p.y === ny)) {
      this.dead = true;
      App.gameOver();
      return;
    }
    this.body.unshift({ x: nx, y: ny });

    if (eatsFood) {
      this.score += 10 * this.level;
      this.eaten++;
      Sound.beep(880, 0.05);
      this.food = this.freeCell();
      if (!this.food) { this.dead = true; App.gameOver(true); return; }
      if (this.eaten % 5 === 0 && !this.bonus) {
        const c = this.freeCell();
        if (c) this.bonus = { ...c, ttl: 50 };
      }
    } else {
      this.body.pop();
    }

    if (eatsBonus) {
      this.score += 20 * this.level + this.bonus.ttl * 2;
      this.bonus = null;
      Sound.seq([660, 990, 1320], 0.05);
      buzz(20);
    } else if (this.bonus && --this.bonus.ttl <= 0) {
      this.bonus = null;
    }
    App.hud();
  },

  render(ctx, now) {
    const { cols, rows } = this;
    ctx.fillStyle = LCD.bg;
    ctx.fillRect(0, 0, cols, rows);
    ctx.fillStyle = LCD.dot;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) ctx.fillRect(x + 0.44, y + 0.44, 0.12, 0.12);

    ctx.fillStyle = LCD.ink;
    if (this.food) {
      const { x, y } = this.food;
      ctx.beginPath();
      ctx.moveTo(x + 0.5, y + 0.15); ctx.lineTo(x + 0.85, y + 0.5);
      ctx.lineTo(x + 0.5, y + 0.85); ctx.lineTo(x + 0.15, y + 0.5);
      ctx.fill();
    }
    if (this.bonus && (this.bonus.ttl > 15 || Math.floor(now / 120) % 2)) {
      const { x, y } = this.bonus;
      ctx.beginPath(); ctx.arc(x + 0.5, y + 0.5, 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = LCD.bg;
      ctx.beginPath(); ctx.arc(x + 0.5, y + 0.5, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = LCD.ink;
      // countdown bar along the bottom
      ctx.globalAlpha = 0.5;
      ctx.fillRect(0, rows - 0.15, cols * (this.bonus.ttl / 50), 0.15);
      ctx.globalAlpha = 1;
    }

    if (this.dead && Math.floor(now / 180) % 2) return; // blink when dead
    const b = this.body, m = 0.12;
    for (let i = 0; i < b.length; i++) {
      const p = b[i];
      ctx.fillRect(p.x + m, p.y + m, 1 - 2 * m, 1 - 2 * m);
      if (i > 0) {
        const q = b[i - 1];
        ctx.fillRect(Math.min(p.x, q.x) + m, Math.min(p.y, q.y) + m,
          Math.abs(p.x - q.x) + 1 - 2 * m, Math.abs(p.y - q.y) + 1 - 2 * m);
      }
    }
    // eyes
    const h = b[0], d = this.dir;
    ctx.fillStyle = LCD.bg;
    const cx = h.x + 0.5 + d.x * 0.15, cy = h.y + 0.5 + d.y * 0.15;
    const ox = d.y * 0.18, oy = d.x * 0.18;
    ctx.fillRect(cx + ox - 0.07, cy + oy - 0.07, 0.14, 0.14);
    ctx.fillRect(cx - ox - 0.07, cy - oy - 0.07, 0.14, 0.14);
  },
};

/* ================= STACKFALL (falling blocks) ================= */
// Tier 0 pieces are always in play; tier 1 (5-cell) pieces join from level 3.
const PIECES = [
  { tier: 0, w: 1, c: '#67e8f9', m: ['...', '###', '...'] },
  { tier: 0, w: 1, c: '#f9a8d4', m: ['#.', '##'] },
  { tier: 0, w: 2, c: '#22d3ee', m: ['....', '####', '....', '....'] },
  { tier: 0, w: 2, c: '#facc15', m: ['##', '##'] },
  { tier: 0, w: 2, c: '#a855f7', m: ['.#.', '###', '...'] },
  { tier: 0, w: 2, c: '#22c55e', m: ['.##', '##.', '...'] },
  { tier: 0, w: 2, c: '#ef4444', m: ['##.', '.##', '...'] },
  { tier: 0, w: 2, c: '#3b82f6', m: ['#..', '###', '...'] },
  { tier: 0, w: 2, c: '#f97316', m: ['..#', '###', '...'] },
  { tier: 1, w: 1, c: '#14b8a6', m: ['##.', '##.', '#..'] },
  { tier: 1, w: 1, c: '#e879f9', m: ['#.#', '###', '...'] },
  { tier: 1, w: 1, c: '#c084fc', m: ['###', '.#.', '.#.'] },
  { tier: 1, w: 1, c: '#fb7185', m: ['.#.', '###', '.#.'] },
  { tier: 1, w: 1, c: '#a3e635', m: ['#..', '##.', '.##'] },
].map((p) => ({ ...p, m: p.m.map((r) => [...r].map((ch) => (ch === '#' ? 1 : 0))) }));

const rotateCW = (m) => m.map((row, r) => row.map((_, c) => m[m.length - 1 - c][r]));
const KICKS = [[0, 0], [-1, 0], [1, 0], [-2, 0], [2, 0], [0, -1], [-1, -1], [1, -1]];
const LINE_SCORE = [0, 100, 300, 500, 800];

const BlocksGame = {
  id: 'blocks', title: 'Stackfall', cols: 10, rows: 20, accent: '--blocks',
  help: 'Fill a row to clear it. Clear rows back-to-back for combo bonuses.\nFrom level 3, five-cell pieces join the mix!',

  reset() {
    this.grid = Array.from({ length: this.rows }, () => Array(this.cols).fill(null));
    this.bag = [];
    this.score = 0; this.lines = 0; this.combo = -1;
    this.acc = 0; this.lockT = 0; this.lockResets = 0;
    this.soft = false; this.hold = null; this.flashT = 0; this.dead = false;
    this.next = this.take();
    this.spawn();
  },
  get level() { return 1 + Math.floor(this.lines / 10); },
  get interval() { return Math.max(60, 800 * Math.pow(0.85, this.level - 1)); },
  summary() { return `Lines ${this.lines}`; },

  take() {
    if (!this.bag.length) {
      const pool = PIECES.filter((p) => p.tier <= (this.level >= 3 ? 1 : 0));
      for (const p of pool) for (let i = 0; i < p.w; i++) this.bag.push(p);
      for (let i = this.bag.length - 1; i > 0; i--) {
        const j = rand(i + 1); [this.bag[i], this.bag[j]] = [this.bag[j], this.bag[i]];
      }
    }
    return this.bag.pop();
  },

  spawn() {
    const p = this.next;
    this.next = this.take();
    const m = p.m.map((r) => r.slice());
    const top = m.findIndex((r) => r.some(Boolean));
    this.cur = { m, c: p.c, x: Math.floor((this.cols - m.length) / 2), y: -top };
    this.lockT = 0; this.lockResets = 0; this.acc = 0;
    if (this.collides(m, this.cur.x, this.cur.y)) { this.dead = true; App.gameOver(); }
  },

  collides(m, x, y) {
    for (let r = 0; r < m.length; r++) for (let c = 0; c < m.length; c++) {
      if (!m[r][c]) continue;
      const gx = x + c, gy = y + r;
      if (gx < 0 || gx >= this.cols || gy >= this.rows) return true;
      if (gy >= 0 && this.grid[gy][gx]) return true;
    }
    return false;
  },
  grounded() { const c = this.cur; return this.collides(c.m, c.x, c.y + 1); },
  touched() { if (this.grounded() && this.lockResets < 15) { this.lockT = 0; this.lockResets++; } },

  move(dx) {
    const c = this.cur;
    if (this.collides(c.m, c.x + dx, c.y)) return false;
    c.x += dx; this.touched(); Sound.beep(220, 0.02, 'triangle');
    return true;
  },
  rotate() {
    const c = this.cur, m = rotateCW(c.m);
    for (const [kx, ky] of KICKS) {
      if (!this.collides(m, c.x + kx, c.y + ky)) {
        c.m = m; c.x += kx; c.y += ky; this.touched(); Sound.beep(330, 0.03, 'triangle');
        return;
      }
    }
  },
  ghostY() { const c = this.cur; let y = c.y; while (!this.collides(c.m, c.x, y + 1)) y++; return y; },
  hardDrop() {
    const y = this.ghostY();
    this.score += (y - this.cur.y) * 2;
    this.cur.y = y;
    this.lock();
  },

  lock() {
    const { m, x, y, c } = this.cur;
    let above = false;
    for (let r = 0; r < m.length; r++) for (let k = 0; k < m.length; k++) {
      if (!m[r][k]) continue;
      if (y + r < 0) above = true; else this.grid[y + r][x + k] = c;
    }
    if (above) { this.dead = true; App.gameOver(); return; }

    const before = this.level;
    const full = [];
    this.grid.forEach((row, i) => { if (row.every(Boolean)) full.push(i); });
    if (full.length) {
      this.grid = this.grid.filter((_, i) => !full.includes(i));
      while (this.grid.length < this.rows) this.grid.unshift(Array(this.cols).fill(null));
      this.combo++;
      this.score += (LINE_SCORE[full.length] + 50 * this.combo) * before;
      this.lines += full.length;
      this.flashT = 160;
      Sound.seq(full.length >= 4 ? [523, 659, 784, 1047] : [523, 784], 0.06);
      buzz(full.length >= 4 ? 60 : 25);
      if (this.level > before) { Sound.seq([392, 523, 659, 784, 1047], 0.07); this.bag = []; }
    } else {
      this.combo = -1;
      Sound.beep(140, 0.04, 'triangle');
    }
    App.hud();
    this.spawn();
  },

  press(a) {
    if (a === 'left' || a === 'right') {
      const dx = a === 'left' ? -1 : 1;
      this.move(dx);
      this.hold = { dx, t: 0, next: 170 };       // auto-repeat while held
    } else if (a === 'down') this.soft = true;
    else if (a === 'rotate' || a === 'up') this.rotate();
    else if (a === 'drop' || a === 'space') this.hardDrop();
  },
  release(a) {
    if ((a === 'left' && this.hold?.dx === -1) || (a === 'right' && this.hold?.dx === 1)) this.hold = null;
    if (a === 'down') this.soft = false;
  },
  gesture(g, info) {
    if (g === 'tap' || g === 'up') this.rotate();
    else if (g === 'down') this.hardDrop();
    else {
      const n = Math.max(1, Math.round(Math.abs(info.dx) / info.cellPx));
      for (let i = 0; i < n; i++) if (!this.move(g === 'left' ? -1 : 1)) break;
    }
  },
  swipeLive: false,

  update(dt) {
    if (this.flashT > 0) this.flashT -= dt;
    if (this.hold) {
      this.hold.t += dt;
      while (this.hold && this.hold.t >= this.hold.next) { this.move(this.hold.dx); this.hold.next += 45; }
    }
    if (this.grounded()) {
      this.acc = 0;
      this.lockT += dt;
      if (this.lockT >= 450) this.lock();
      return;
    }
    this.lockT = 0;
    this.acc += dt;
    const iv = this.soft ? Math.min(35, this.interval) : this.interval;
    while (this.acc >= iv) {
      this.acc -= iv;
      if (this.grounded()) { this.acc = 0; break; }
      this.cur.y++;
      if (this.soft) { this.score++; App.hud(); }
    }
  },

  block(ctx, x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x + 0.04, y + 0.04, 0.92, 0.92);
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.fillRect(x + 0.04, y + 0.04, 0.92, 0.14);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.fillRect(x + 0.04, y + 0.82, 0.92, 0.14);
  },

  render(ctx) {
    const { cols, rows } = this;
    ctx.fillStyle = '#0b0e14';
    ctx.fillRect(0, 0, cols, rows);
    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    ctx.lineWidth = 0.04;
    ctx.beginPath();
    for (let x = 1; x < cols; x++) { ctx.moveTo(x, 0); ctx.lineTo(x, rows); }
    for (let y = 1; y < rows; y++) { ctx.moveTo(0, y); ctx.lineTo(cols, y); }
    ctx.stroke();

    this.grid.forEach((row, y) => row.forEach((c, x) => { if (c) this.block(ctx, x, y, c); }));

    if (!this.dead) {
      const { m, x, y, c } = this.cur;
      const gy = this.ghostY();
      ctx.strokeStyle = c; ctx.globalAlpha = 0.45; ctx.lineWidth = 0.08;
      for (let r = 0; r < m.length; r++) for (let k = 0; k < m.length; k++)
        if (m[r][k] && gy + r >= 0) ctx.strokeRect(x + k + 0.12, gy + r + 0.12, 0.76, 0.76);
      ctx.globalAlpha = 1;
      for (let r = 0; r < m.length; r++) for (let k = 0; k < m.length; k++)
        if (m[r][k] && y + r >= 0) this.block(ctx, x + k, y + r, c);
    } else {
      ctx.fillStyle = 'rgba(11,14,20,.35)';
      ctx.fillRect(0, 0, cols, rows);
    }

    if (this.flashT > 0) {
      ctx.fillStyle = `rgba(255,255,255,${(this.flashT / 160) * 0.22})`;
      ctx.fillRect(0, 0, cols, rows);
    }
  },

  renderNext(ctx) {
    ctx.clearRect(0, 0, 5, 5);
    const m = this.next.m;
    let x0 = 9, x1 = -1, y0 = 9, y1 = -1;
    m.forEach((row, r) => row.forEach((v, c) => {
      if (v) { x0 = Math.min(x0, c); x1 = Math.max(x1, c); y0 = Math.min(y0, r); y1 = Math.max(y1, r); }
    }));
    const ox = (5 - (x1 - x0 + 1)) / 2 - x0, oy = (5 - (y1 - y0 + 1)) / 2 - y0;
    m.forEach((row, r) => row.forEach((v, c) => { if (v) this.block(ctx, c + ox, r + oy, this.next.c); }));
  },
};

/* ================= APP SHELL ================= */
const GAMES = { snake: SnakeGame, blocks: BlocksGame };
const board = $('#board'), nextCanvas = $('#next'), stage = $('#stage');
let boardCtx = null, nextCtx = null, cellPx = 16;

const App = {
  game: null,
  state: 'menu', // menu | ready | running | paused | over

  showMenu() {
    this.state = 'menu';
    this.game = null;
    $('#game').hidden = true;
    $('#menu').hidden = false;
    for (const id in GAMES) $('#best-' + id).textContent = store.get('best:' + id, 0);
  },

  open(id) {
    const g = GAMES[id];
    this.game = g;
    g.reset();
    document.documentElement.style.setProperty('--accent', `var(${g.accent})`);
    $('#menu').hidden = true;
    $('#game').hidden = false;
    const isSnake = id === 'snake';
    $('#pad-snake').hidden = !isSnake; $('#keys-snake').hidden = !isSnake;
    $('#pad-blocks').hidden = isSnake; $('#keys-blocks').hidden = isSnake;
    $('#hud-next').hidden = isSnake;
    nextCtx = fitCanvas(nextCanvas, 5, 5, 6);
    this.layout();
    this.hud();
    this.setState('ready');
  },

  layout() {
    if (!this.game) return;
    const r = stage.getBoundingClientRect();
    const { cols, rows } = this.game;
    cellPx = Math.max(6, Math.floor(Math.min((r.width - 4) / cols, (r.height - 4) / rows)));
    boardCtx = fitCanvas(board, cols, rows, cellPx);
  },

  setState(s) {
    this.state = s;
    const g = this.game, ov = $('#overlay');
    ov.hidden = s === 'running';
    $('#btn-pause').textContent = s === 'running' ? '❚❚' : '▶';
    if (s === 'ready') this.overlay(g.title, g.help, 'Start');
    if (s === 'paused') this.overlay('Paused', `Score ${g.score}\n${g.summary()}`, 'Resume');
  },

  overlay(title, text, primary) {
    $('#ov-title').textContent = title;
    $('#ov-text').textContent = text;
    $('#ov-primary').textContent = primary;
  },

  primary() {
    if (this.state === 'over') { this.game.reset(); this.hud(); }
    if (this.state !== 'menu') this.setState('running');
  },

  togglePause() {
    if (this.state === 'running') this.setState('paused');
    else if (this.state === 'paused' || this.state === 'ready') this.setState('running');
  },

  gameOver(win = false) {
    const g = this.game;
    const key = 'best:' + g.id;
    const best = store.get(key, 0);
    const record = g.score > best;
    if (record) store.set(key, g.score);
    this.hud();
    this.setState('over');
    this.overlay(win ? 'You win!' : record ? 'New best!' : 'Game over',
      `Score ${g.score} · Level ${g.level}\n${g.summary()}`, 'Play again');
    Sound.seq(record || win ? [523, 659, 784, 1047] : [392, 330, 262, 196], 0.12);
    buzz([60, 40, 120]);
  },

  hud() {
    const g = this.game;
    if (!g) return;
    $('#hud-score').textContent = g.score;
    $('#hud-best').textContent = Math.max(g.score, store.get('best:' + g.id, 0));
    $('#hud-level').textContent = g.level;
  },

  /* Unified input: keyboard keys and touch buttons both call this. */
  input(action, down) {
    if (!this.game) return;
    if (down && action === 'pause') return this.togglePause();
    if (down && (action === 'enter' || action === 'space') && this.state !== 'running') return this.primary();
    if (this.state !== 'running') return;
    if (down) this.game.press(action); else this.game.release(action);
  },
};

/* ---------- Main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last);
  last = now;
  const g = App.game;
  if (g) {
    if (App.state === 'running') g.update(dt);
    if (boardCtx) g.render(boardCtx, now);
    if (g === BlocksGame && nextCtx) g.renderNext(nextCtx);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Keyboard ---------- */
const KEYS = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyX: 'rotate', KeyZ: 'rotate', Space: 'space', Enter: 'enter',
  KeyP: 'pause', Escape: 'pause',
};
addEventListener('keydown', (e) => {
  const a = KEYS[e.code];
  if (!a || !App.game) return;
  e.preventDefault();
  if (e.repeat) return; // games handle their own auto-repeat
  App.input(a, true);
});
addEventListener('keyup', (e) => { const a = KEYS[e.code]; if (a) App.input(a, false); });

/* ---------- Touch buttons ---------- */
document.querySelectorAll('.pad button').forEach((btn) => {
  const a = btn.dataset.action;
  const up = () => { if (btn.classList.contains('down')) { btn.classList.remove('down'); App.input(a, false); } };
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.classList.add('down'); App.input(a, true); });
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
});

/* ---------- Swipe / tap on the board ---------- */
let swipe = null;
stage.addEventListener('pointerdown', (e) => {
  if (App.state !== 'running') return;
  swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, fired: false };
});
stage.addEventListener('pointermove', (e) => {
  if (!swipe || swipe.id !== e.pointerId || !App.game?.swipeLive) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.hypot(dx, dy) < 22) return;
  App.game.gesture(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  swipe.x = e.clientX; swipe.y = e.clientY; swipe.fired = true;
});
const endSwipe = (e) => {
  if (!swipe || swipe.id !== e.pointerId) return;
  const s = swipe; swipe = null;
  if (App.state !== 'running' || App.game.swipeLive) return;
  const dx = e.clientX - s.sx, dy = e.clientY - s.sy;
  let g = 'tap';
  if (Math.hypot(dx, dy) >= 16) g = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  App.game.gesture(g, { dx, dy, cellPx });
};
stage.addEventListener('pointerup', endSwipe);
stage.addEventListener('pointercancel', () => { swipe = null; });

/* ---------- Buttons ---------- */
document.querySelectorAll('[data-game]').forEach((b) => b.addEventListener('click', () => App.open(b.dataset.game)));
$('#btn-back').addEventListener('click', () => App.showMenu());
$('#btn-pause').addEventListener('click', () => App.togglePause());
$('#ov-primary').addEventListener('click', () => App.primary());
$('#ov-menu').addEventListener('click', () => App.showMenu());

const soundBtn = $('#btn-sound');
const paintSound = () => { soundBtn.textContent = Sound.on ? '🔊 Sound on' : '🔇 Sound off'; };
soundBtn.addEventListener('click', () => { Sound.on = !Sound.on; store.set('sound', Sound.on); paintSound(); Sound.beep(660); });
paintSound();

/* Auto-pause when the app is hidden (phone call, app switch…) */
document.addEventListener('visibilitychange', () => { if (document.hidden && App.state === 'running') App.setState('paused'); });
new ResizeObserver(() => App.layout()).observe(stage);

/* ---------- Install as an app ---------- */
let installEvt = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; $('#btn-install').hidden = false; });
$('#btn-install').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null; $('#btn-install').hidden = true;
});
addEventListener('appinstalled', () => { $('#btn-install').hidden = true; });
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) $('#ios-hint').hidden = false;

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

App.showMenu();
</script>
</body>
</html>
